[project]
name = "doc-to-llm"
version = "0.1.0"
description = "API that formats, enhances and translates VitePress Markdown documentation with an LLM"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.118.0",
    "langchain>=0.3.27",
    "langchain-openai>=0.3.34",
    "openai>=2.0.1",
    "pydantic-settings>=2.11.0",
    "uvicorn>=0.37.0",
]

[tool.uv.pip]
upgrade = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.13.2",
    "tomli-w>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
