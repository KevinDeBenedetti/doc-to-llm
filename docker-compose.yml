services:
  api:
    container_name: doc-to-llm
    env_file:
      - .env
    build:
      context: apps/server
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8000:8000"
    volumes:
      # Live code for --reload; the image keeps its virtualenv in /opt/venv.
      - ./apps/server:/app
    restart: always
