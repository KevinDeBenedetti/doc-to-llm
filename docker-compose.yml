services:
  api:
    container_name: doc-to-llm
    env_file:
      - .env
    build:
      context: apps/server
      dockerfile: Dockerfile
      target: dev
    ports:
      # Loopback only: the API spends the LLM quota of whoever runs it.
      - "127.0.0.1:8000:8000"
    volumes:
      # Live code for --reload; the image keeps its virtualenv in /opt/venv.
      - ./apps/server:/app
    restart: always
