version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /apps/server
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /apps/server
    schedule:
      interval: weekly
