name: CI – Tests

on:
  workflow_call:
    inputs:
      PYTHON_VERSION:
        description: Python version used to run the tests
        required: true
        type: string
  workflow_dispatch:
    inputs:
      PYTHON_VERSION:
        description: Python version used to run the tests
        required: true
        type: string
        default: "3.13"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"

      - name: Set up Python ${{ inputs.PYTHON_VERSION }}
        run: uv python install ${{ inputs.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ./apps/server
        run: |
          uv sync --locked --dev

      - name: Run pytest
        working-directory: ./apps/server
        run: |
          uv run pytest
